name: Secret availability
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check availability without disclosure
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
        run: |
          if [ -z "$LAB_SECRET" ]; then
            echo "Practice secret unavailable"
            exit 1
          fi
          echo "Practice secret available; value withheld"
