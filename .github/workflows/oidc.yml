name: OIDC login test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read the lab resource group
        env:
          LAB_RG_NAME: ${{ vars.LAB_RG_NAME }}
        run: az group show --name "$LAB_RG_NAME" --query properties.provisioningState
